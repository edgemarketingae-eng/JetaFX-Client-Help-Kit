<style>
/* Layout: matches payments.edgeverse.ae — white page, sticky header (mark + badge + pill nav), one narrow column of cards with label/value rows and a full-width green copy button. Deliberately light-only, like the reference. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --fg:#0B1F1E; --muted:#5E6E6D; --line:#DDE7E6; --line-soft:#E7EEED;
  --head-a:#F2F7F7; --head-b:#FFFFFF; --sunk:#F5F9F9;
  --green:#08E186; --emerald:#0A6B4F; --mint:#E6F8EF; --ink:#021A1A;
  --ph-bg:#FFF2D9; --ph-fg:#7A4B00;
  --font:"Manrope","Noto Sans Malayalam",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --ml:"Noto Sans Malayalam","Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:130px}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.col{max-width:636px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:14px 8px}
.top img{width:38px;height:38px;display:block}
.badge{background:var(--mint);color:var(--emerald);font-weight:600;font-size:13px;padding:6px 11px;border-radius:999px}
.pills{position:relative;display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills a{flex:none;text-decoration:none;color:var(--fg);font-weight:700;font-size:13.5px;padding:8px 13px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg)}
.pills a.on{background:var(--ink);border-color:var(--ink);color:#fff}

main .col{padding-block:22px 60px;display:grid;gap:18px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:12px 0 4px;text-wrap:balance}
h2.sec{font-size:22px;font-weight:800;letter-spacing:-.015em;margin:26px 0 0}
.intro{color:var(--muted);margin:0}
.intro b{color:#3E4D4C}

.card{border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg)}
.card-head{padding:18px 18px 16px;background:linear-gradient(180deg,var(--head-a),var(--head-b));border-bottom:1.5px solid var(--line)}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--emerald);margin:0 0 6px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.card-title{font-size:18px;font-weight:800;line-height:1.35;margin:0}
.card-title.ml{font-family:var(--ml);font-weight:700}
.card-sub{font-size:13.5px;color:var(--muted);margin:3px 0 0}
.rows{padding:4px 18px}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1.5px dashed var(--line-soft)}
.r:last-child{border-bottom:0}
.r .t{min-width:0}
.k{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.v{display:block;font-weight:700;font-size:15.5px;word-break:break-word}
.v.url{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--mint);color:var(--emerald)}
.ib{flex:none;width:40px;height:38px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--fg);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 2px rgba(2,26,26,.06)}
.ib:hover{border-color:#B9CCCA}
.ib svg{width:16px;height:16px}
.ib.done{background:var(--green);border-color:var(--green)}
.foot{padding:4px 18px 16px;display:grid;gap:4px}
.big{font:inherit;font-weight:800;font-size:16px;width:100%;border:0;border-radius:12px;background:var(--green);color:var(--ink);padding:14px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;text-decoration:none}
.big:hover{filter:brightness(.96)}
.big svg{width:18px;height:18px}
.big.done{background:var(--emerald);color:#fff}
.alt{display:flex;gap:8px;flex-wrap:wrap}
.alt .sec-btn{flex:1 1 140px}
.sec-btn{font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:#fff;color:var(--fg);border-radius:12px;padding:11px;cursor:pointer;text-align:center;text-decoration:none}
.sec-btn:hover{border-color:#B9CCCA}
.sec-btn.done{background:var(--mint);border-color:var(--green)}
.link{font:inherit;background:none;border:0;color:var(--emerald);font-weight:700;font-size:13.5px;padding:8px;cursor:pointer;justify-self:center}
.link:hover{text-decoration:underline}
pre.msg{white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:13.5px;line-height:1.6;background:var(--sunk);border:1.5px solid var(--line-soft);border-radius:12px;padding:14px;margin:4px 0 0;max-height:440px;overflow:auto}
.ph{background:var(--ph-bg);color:var(--ph-fg);border-radius:4px;padding:0 3px;font-weight:600}
.filled{background:var(--mint);border-radius:4px;padding:0 3px;font-weight:700;color:var(--emerald)}

.seg{display:flex;background:var(--sunk);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(2,26,26,.12)}

details.fill{border-top:1.5px solid var(--line);}
details.fill summary{cursor:pointer;list-style:none;padding:13px 18px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
details.fill summary::-webkit-details-marker{display:none}
details.fill summary::after{content:"+";font-size:20px;color:var(--muted);font-weight:500}
details.fill[open] summary::after{content:"−"}
.fields{padding:0 18px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field textarea{font:inherit;font-size:14.5px;font-weight:600;padding:10px 11px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--fg);width:100%}
.field textarea{resize:vertical;min-height:60px}
.field input::placeholder,.field textarea::placeholder{color:#9AA9A8;font-weight:500}
.clear{grid-column:1/-1;justify-self:start;font:inherit;font-size:13px;font-weight:700;color:var(--emerald);background:none;border:0;padding:2px 0;cursor:pointer}

:focus-visible{outline:2px solid var(--green);outline-offset:2px}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
footer .col{padding-block:18px}
footer a{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:480px){.fields{grid-template-columns:1fr} h1{font-size:26px}}
</style>

  sales:"Our client has placed a withdrawal request, but the amount has not been received yet. The client is waiting for an update.\n\nClient Name: {name}\nClient ID: {id}\nWithdrawal Amount: {amount}\nWithdrawal Method: {wmethod}\nDate of Request: {date}\n\nI have attached a screenshot of the request. Kindly check the status and let us know when the client can expect to receive the funds.\n\n"},
 {key:"deposit",title:"Deposit Not Credited",sub:"Payment made, wallet not updated",attach:"Payment proof",fields:["name","id","amount","dmethod","date","ref"],
  client:"I have made a deposit, but the amount is not yet credited to my JetaFX wallet.\n\nName: {name}\nClient ID: {id}\nDeposit Amount: {amount}\nDeposit Method: {dmethod}\nDate of Payment: {date}\nTransaction / Reference ID: {ref}\n\nI have attached the payment proof for your reference. Kindly verify the payment and credit the amount to my wallet as soon as possible.\n\n",
  sales:"Our client has made a deposit, but the amount is not yet credited to their JetaFX wallet.\n\nClient Name: {name}\nClient ID: {id}\nDeposit Amount: {amount}\nDeposit Method: {dmethod}\nDate of Payment: {date}\nTransaction / Reference ID: {ref}\n\nI have attached the payment proof for your reference. Kindly verify the payment and credit the amount to the client's wallet as soon as possible.\n\n"},
 {key:"negative",title:"Negative Balance Removal",sub:"Reset MT5 balance to zero",attach:"Screenshot of the account balance",fields:["name","id","mt5","amount","date"],
  client:"My trading account is currently showing a negative balance. I kindly request you to reset the balance to zero so I can continue trading.\n\nName: {name}\nClient ID: {id}\nMT5 Account: {mt5}\nNegative Balance: -{amount}\nDate: {date}\n\nI have attached a screenshot of my account balance. Kindly review and help me resolve this.\n\n",
  sales:"Our client's trading account is currently showing a negative balance. We kindly request you to reset the balance to zero so the client can continue trading.\n\nClient Name: {name}\nClient ID: {id}\nMT5 Account: {mt5}\nNegative Balance: -{amount}\nDate: {date}\n\nI have attached a screenshot of the account balance. Kindly review and help us resolve this.\n\n"},
];

let mode="client"; try{const m=localStorage.getItem('jfx-mode'); if(m==='sales'||m==='client') mode=m;}catch(e){}
const vals=T.map(()=>({}));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lab=k=>LABELS[mode][k]||LABELS.common[k];
const subjTpl=i=>`${T[i].title} – {name} | ID: {id}`;
const bodyTpl=i=>OPEN+T[i][mode]+SIGN[mode];
const fillT=(tpl,i)=>tpl.replace(/\{(\w+)\}/g,(m,k)=>{const v=(vals[i][k]||"").trim();return v||`[${lab(k)}]`;});
const fillH=(tpl,i)=>esc(tpl).replace(/\{(\w+)\}/g,(m,k)=>{const v=(vals[i][k]||"").trim();return v?`<span class="filled">${esc(v)}</span>`:`<span class="ph">[${esc(lab(k))}]</span>`;});
const waMsg=i=>`*JetaFX Support Email – ${T[i].title}*\n\nPlease send this email to *${SUPPORT_EMAIL}*. Replace everything in [brackets] with your details and attach: *${T[i].attach.toLowerCase()}*.\n\n*Subject:*\n${fillT(subjTpl(i),i)}\n\n*Email:*\n${fillT(bodyTpl(i),i)}`;

/* ---------- build ---------- */
const main=document.getElementById('main');
const nav=document.getElementById('pills');
const navItems=[];
function addNav(id,label){const a=document.createElement('a');a.href='#'+id;a.textContent=label;nav.appendChild(a);navItems.push([id,a]);}
function row(k,vHTML,copyKey,extra=""){return `<div class="r"><div class="t"><span class="k">${k}</span>${vHTML}</div>${copyKey?`<button class="ib" data-copy="${copyKey}" aria-label="Copy ${esc(k)}">${IC}</button>`:extra}</div>`;}

// Videos
const h2v=document.createElement('h2');h2v.className='sec';h2v.id='videos';h2v.textContent='Help videos (Malayalam)';main.appendChild(h2v);
addNav('videos','All videos');
const all=document.createElement('section');all.className='card';
all.innerHTML=`<div class="card-head"><p class="eyebrow">Full series · 5 Shorts</p><h3 class="card-title">Send all 5 help videos</h3><p class="card-sub">One message with every link, in order. Good for new clients.</p></div>
<div class="rows">${VIDEOS.map((v,i)=>row(`Part ${i+1} · ${v.tag}`,`<span class="v url">${v.url.replace('https://www.','')}</span>`,`link:${i}`)).join('')}</div>
<div class="foot"><button class="big" data-copy="series">${IC}Copy full message</button><button class="link" data-preview="p-series">Preview message</button><pre class="msg" id="p-series" hidden></pre></div>`;
main.appendChild(all);
document.getElementById('p-series').textContent=seriesMsg();

VIDEOS.forEach((v,i)=>{
  const id='part-'+(i+1); addNav(id,`Part ${i+1} · ${v.tag}`);
  const c=document.createElement('section');c.className='card';c.id=id;
  c.innerHTML=`<div class="card-head"><p class="eyebrow">Part ${i+1} · ${v.tag}</p><h3 class="card-title ml" lang="ml">${v.ml}</h3><p class="card-sub">${v.en}</p></div>
  <div class="rows">
   ${row('Video link',`<span class="v url">${v.url.replace('https://www.','')}</span>`,`link:${i}`)}
   ${row('Send when the client says',`<div class="chips">${v.when.map(w=>`<span class="chip">“${w}”</span>`).join('')}</div>`,null,`<a class="ib" href="${v.url}" target="_blank" rel="noopener" aria-label="Watch Part ${i+1}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></a>`)}
  </div>
  <div class="foot"><button class="big" data-copy="vid:${i}">${IC}Copy full message</button><button class="link" data-preview="p-v${i}">Preview message</button><pre class="msg" id="p-v${i}" hidden></pre></div>`;
  main.appendChild(c);
  document.getElementById('p-v'+i).textContent=vidMsg(v,i);
});

// Emails
const eh=document.createElement('div');eh.id='emails';
eh.innerHTML=`<h2 class="sec">Support email templates</h2><p class="intro" style="margin-top:4px">Blank fields stay as <span class="ph">[brackets]</span> for the client to fill in. Open <b>Fill in details</b> to add what you already know.</p>
<div class="seg" role="group" aria-label="Who sends the email"><button type="button" data-mode="client">Client sends</button><button type="button" data-mode="sales">Sales team sends</button></div>`;
main.appendChild(eh);
addNav('emails','Email templates');

T.forEach((t,i)=>{
  const id='email-'+t.key; addNav(id,t.title);
  const c=document.createElement('section');c.className='card';c.id=id;c.dataset.i=i;
  c.innerHTML=`<div class="card-head"><p class="eyebrow">Email to JetaFX support</p><h3 class="card-title">${t.title}</h3><p class="card-sub">${t.sub}</p></div>
  <div class="rows">
    ${row('Send to',`<span class="v">${SUPPORT_EMAIL}</span>`,'to')}
    ${row('Subject',`<span class="v" data-subj></span>`,`subj:${i}`)}
    ${row('Attach',`<span class="v">${t.attach}</span>`,null,'')}
  </div>
  <details class="fill"><summary>Fill in details (optional)</summary><div class="fields" data-fields></div></details>
  <div class="foot" style="border-top:1.5px solid var(--line);padding-top:16px">
    <button class="big" data-copy="email:${i}">${IC}Copy full email</button>
    <div class="alt"><button class="sec-btn" data-copy="both:${i}">Copy subject + email</button><button class="sec-btn" data-copy="wa:${i}" data-wa>Copy for WhatsApp</button></div>
    <button class="link" data-preview="p-e${i}">Preview email</button>
    <pre class="msg" id="p-e${i}" hidden></pre>
  </div>`;
  main.appendChild(c);
});

function renderEmails(){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  document.querySelectorAll('[data-wa]').forEach(b=>b.hidden=mode!=='client');
  T.forEach((t,i)=>{
    const c=document.getElementById('email-'+t.key);
    c.querySelector('[data-subj]').innerHTML=fillH(subjTpl(i),i);
    document.getElementById('p-e'+i).innerHTML=fillH(bodyTpl(i),i);
    const box=c.querySelector('[data-fields]');box.innerHTML='';
    const keys=[...t.fields,...(mode==='client'?['phone']:['agent'])];
    keys.forEach(k=>{
      const d=document.createElement('div');d.className='field'+(k==='issue'?' wide':'');
      const fid=`f-${t.key}-${k}`;
      d.innerHTML=`<label for="${fid}">${FIELD_UI[k]}</label>`+(k==='issue'?`<textarea id="${fid}" placeholder="${esc(lab(k))}"></textarea>`:`<input id="${fid}" type="text" placeholder="${esc(lab(k))}">`);
      const inp=d.querySelector('input,textarea');inp.value=vals[i][k]||'';
      inp.addEventListener('input',()=>{vals[i][k]=inp.value;c.querySelector('[data-subj]').innerHTML=fillH(subjTpl(i),i);document.getElementById('p-e'+i).innerHTML=fillH(bodyTpl(i),i);});
      box.appendChild(d);
    });
    const cl=document.createElement('button');cl.type='button';cl.className='clear';cl.textContent='Clear fields';
    cl.onclick=()=>{vals[i]={};renderEmails();};box.appendChild(cl);
  });
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;try{localStorage.setItem('jfx-mode',mode)}catch(e){};renderEmails();});
renderEmails();

/* ---------- preview toggles ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-preview]');if(!b)return;const p=document.getElementById(b.dataset.preview);p.hidden=!p.hidden;b.textContent=(p.hidden?'Preview ':'Hide ')+(b.textContent.includes('email')?'email':'message');});

/* ---------- copy ---------- */
const toast=document.getElementById('toast');let tt;
const showToast=m=>{toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1600);};
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok;}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]');if(!b||b.classList.contains('done'))return;
  const [kind,n]=b.dataset.copy.split(':');const i=+n;let text='',msg='Copied';
  if(kind==='series'){text=seriesMsg();msg='All 5 videos copied';}
  else if(kind==='vid'){text=vidMsg(VIDEOS[i],i);msg=`Part ${i+1} copied`;}
  else if(kind==='link'){text=VIDEOS[i].url;msg='Link copied';}
  else if(kind==='to'){text=SUPPORT_EMAIL;msg='Email address copied';}
  else if(kind==='subj'){text=fillT(subjTpl(i),i);msg='Subject copied';}
  else if(kind==='email'){text=fillT(bodyTpl(i),i);msg='Email copied';}
  else if(kind==='both'){text='To: '+SUPPORT_EMAIL+'\nSubject: '+fillT(subjTpl(i),i)+'\n\n'+fillT(bodyTpl(i),i);msg='Subject + email copied';}
  else if(kind==='wa'){text=waMsg(i);msg='WhatsApp message copied';}
  const done=()=>{const old=b.innerHTML;b.classList.add('done');b.innerHTML=b.classList.contains('ib')?CHECK:(b.classList.contains('big')?CHECK+'Copied':'Copied');showToast(msg);setTimeout(()=>{b.classList.remove('done');b.innerHTML=old},1400);};
  const fail=()=>{fallbackCopy(text)?done():showToast('Copy blocked. Open the preview and copy the text by hand.');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fail);else fail();
});

/* ---------- active pill ---------- */
function spy(){
  let cur=navItems[0][0];
  for(const [id] of navItems){const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<160)cur=id;}
  navItems.forEach(([id,a])=>{const on=id===cur;if(on!==a.classList.contains('on')){a.classList.toggle('on',on);if(on){const left=a.offsetLeft-(nav.clientWidth-a.offsetWidth)/2;nav.scrollTo({left:Math.max(0,left),behavior:'smooth'});}}});
}
addEventListener('scroll',spy,{passive:true});spy();
</script>
